defaults:
  remove_compathelper: true
  update_dependabot: true
  dependabot:
    github_actions:
      enabled: true
      interval: weekly
      group_all: true
    julia:
      enabled: true
      interval: weekly
      group_all: true
    npm:
      enabled: false
      interval: weekly
      group_all: true
    cargo:
      enabled: false
      interval: weekly
      group_all: true

repositories:
  - name: TuringLang/AdvancedMH.jl
    julia_directories:
      - "/"

  - name: TuringLang/JuliaBUGS.jl
    julia_directories:
      - "/JuliaBUGS"
      - "/JuliaBUGS/docs"
      - "/JuliaBUGS/test"
      - "/JuliaBUGS/benchmark"
      - "/JuliaBUGS/examples"
    npm_directories:
      - "/DoodleBUGS"
    dependabot:
      npm:
        enabled: true
